<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Network Access</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        --bg-1: #0b1726;
        --bg-2: #13263f;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0369a1;
        --accent-2: #0ea5e9;
        --border: #dbe3ef;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(14, 165, 233, 0.25), transparent 45%),
          radial-gradient(circle at 80% 85%, rgba(3, 105, 161, 0.25), transparent 50%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
      }

      .panel {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 28px 70px rgba(2, 8, 23, 0.35);
        padding: 30px;
      }

      .badge {
        display: inline-block;
        background: #e0f2fe;
        color: #0c4a6e;
        border-radius: 999px;
        padding: 6px 11px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: 30px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 14px;
      }

      .stack {
        margin-top: 22px;
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
      }

      .field input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 14px;
        outline: none;
      }

      .field input:focus {
        border-color: var(--accent-2);
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      .btn-primary {
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #ffffff;
      }

      .btn-secondary {
        background: #f8fafc;
        border: 1px solid #d7e0eb;
        color: #0f172a;
      }

      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <span class="badge">SECURE NETWORK ACCESS</span>
      <h1>Admin Sign In</h1>
      <p>Authorized personnel only. Sign in with your WordPress admin account.</p>

      <form id="secure-login-form" class="stack" method="post" action="/wp-login.php" autocomplete="off">
        <input type="hidden" name="redirect_to" value="/wp-admin/" />
        <input type="hidden" name="testcookie" value="1" />

        <div class="field">
          <label for="log">Username or Email</label>
          <input id="log" name="log" type="text" required />
        </div>

        <div class="field">
          <label for="pwd">Password</label>
          <input id="pwd" name="pwd" type="password" required />
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Continue Securely</button>
          <a class="btn btn-secondary" href="/wp-login.php?action=lostpassword">Forgot Password</a>
        </div>
      </form>

      <p class="hint">If you do not have access, contact your site administrator.</p>
    </main>

    <script>
      (function () {
        var form = document.getElementById('secure-login-form');
        if (!form) return;

        var host = window.location.hostname;
        var proto = window.location.protocol;
        var wpLogin = proto + '//' + host + '/wp-login.php';
        var wpAdmin = proto + '//' + host + '/wp-admin/';

        form.action = wpLogin;
        form.redirect_to.value = wpAdmin;
      })();
    </script>
  </body>
</html>
